services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizwork
      POSTGRES_USER: bizwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U bizwork -d bizwork"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bizwork:${POSTGRES_PASSWORD}@db:5432/bizwork?schema=public
      MEDIA_ROOT: /data/media
    ports: ["127.0.0.1:3000:3000"]
    volumes: [media_data:/data/media]
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    networks: [private]
volumes:
  postgres_data:
  media_data:
  ollama_data:
networks:
  private:
