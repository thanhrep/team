version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bizwork-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bizwork_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bizwork_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bizwork-network
    # IMPORTANT: Do not expose port 5432 to Internet for security
    expose:
      - "5432"

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizwork-app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bizwork_user}:${POSTGRES_PASSWORD:-BizworkSecurePass2026!}@db:5432/${POSTGRES_DB:-bizwork_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://team.linkpc.net}
    volumes:
      - ./backend/app/static/uploads:/app/app/static/uploads
    networks:
      - bizwork-network
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: bizwork-caddy
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-team.linkpc.net}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bizwork-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  bizwork-network:
    driver: bridge
