# Temporary public BIZWORK test deployment on Render.
# Authentication bypass is enabled only for this disposable test environment.
databases:
  - name: bizwork-test-db
    databaseName: bizwork_db
    user: bizwork_user
    plan: free
    region: singapore

services:
  - type: web
    name: bizwork-test
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bizwork-test-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INIT_USERNAME
        value: bizwork_test
      - key: ADMIN_INIT_EMAIL
        value: bizwork-test@example.com
      - key: ADMIN_INIT_PASSWORD
        generateValue: true
      - key: BIZWORK_AUTH_DISABLED
        value: "false"
