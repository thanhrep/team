# Temporary BIZWORK test deployment on Render.
# During Blueprint setup, provide ADMIN_INIT_PASSWORD in the dashboard.
databases:
  - name: bizwork-test-db
    databaseName: bizwork_db
    user: bizwork_user
    plan: free
    region: singapore

services:
  - type: web
    name: bizwork-test
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bizwork-test-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INIT_USERNAME
        value: bizwork_test
      - key: ADMIN_INIT_EMAIL
        value: bizwork-test@example.com
      - key: ADMIN_INIT_PASSWORD
        sync: false
